# Deploys the Worker to Cloudflare on every push to main (and by hand from the Actions tab).
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" token template).
# D1 migrations are applied separately (the token template has no D1 access).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f57b5847c0388337f08d0a78cd8b37be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
